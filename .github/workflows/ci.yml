name: Container CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
jobs:
  container:
    uses: Coflnet/.github/.github/workflows/container-ci.yml@main
    with:
      k8s_file: ""
      repo_url: https://github.com/Coflnet/k8s
    secrets:
      ARGO_WEBHOOK_SECRET: ${{ secrets.ARGO_WEBHOOK_SECRET }}
